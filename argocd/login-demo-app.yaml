apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: login-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ensubahnurisit/login-gitops-demo.git
    targetRevision: main
    path: kubernates

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
